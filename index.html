<!doctype html><html><head><meta charset=utf8><meta name="robots" content="noindex, nofollow, noimageindex"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><script>/* Site password gate (Tom 2026-10-06) */try{var a=localStorage.getItem("site-auth");if(a!=="1"&&a!=="guest")document.documentElement.classList.add("locked");if(a==="guest")document.documentElement.classList.add("guest")}catch(_){document.documentElement.classList.add("locked")}</script>
<title>Trip Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Modern Minimalist: Charcoal #36454F, Slate Gray #708090, Light Gray #D3D3D3, White. */
  --bg:#F4F5F6; --surface:#FFFFFF; --ink:#36454F; --muted:#5F6D78; --line:#D3D3D3;
  --accent:#4A5A67; --accent-ink:#FFFFFF; --flag:#36454F; --flag-ink:#FFFFFF; --good:#4E7A5E; --soft:#ECEEF0;
  --road:#36454F; --slate:#708090; --hero-hi:#D3D3D3; --go-bg:#D6F0DC; --go-ink:#1D4A2A;
  /* Cards have no border stroke, only a soft shadow (Tom 2026-10-06). */
  --card-shadow:0 1px 2px rgba(31,41,51,.06),0 2px 10px rgba(31,41,51,.07);
  /* Route lines on maps stay distinct colours so stages can be told apart. */
  --s1:#2F5D8A; --s2:#A9561F; --s3:#3E7B55;
  --display:Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --body:Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono:Inter, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1E262C; --surface:#273139; --ink:#ECEFF1; --muted:#A9B4BD; --line:#3A464F;
    --accent:#B8C4CD; --accent-ink:#1E262C; --flag:#D3D3D3; --flag-ink:#36454F; --good:#7DBF94; --soft:#303B44;
    --road:#151B20; --slate:#8A9AA8; --hero-hi:#D3D3D3; --go-bg:#A8DDB5; --go-ink:#12301C; --s1:#6FA0D6; --s2:#E0915C; --s3:#72B98C; --card-shadow:0 1px 2px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.03);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1E262C; --surface:#273139; --ink:#ECEFF1; --muted:#A9B4BD; --line:#3A464F;
  --accent:#B8C4CD; --accent-ink:#1E262C; --flag:#D3D3D3; --flag-ink:#36454F; --good:#7DBF94; --soft:#303B44;
  --road:#151B20; --slate:#8A9AA8; --hero-hi:#D3D3D3; --go-bg:#A8DDB5; --go-ink:#12301C; --s1:#6FA0D6; --s2:#E0915C; --s3:#72B98C; --card-shadow:0 1px 2px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.03);
}
*{box-sizing:border-box}
body{overflow-x:clip;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin:0;line-height:1.05}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font:500 12px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--flag);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px}
/* Fixed top menu (Tom 2026-10-08): sticks to the top; full-width backdrop, transparent while it sits over a hero photo */
.top{position:sticky;top:0;z-index:50}
.top::before{content:"";position:absolute;inset:0 calc(50% - 50vw);z-index:-1;background:var(--bg);transition:background .2s,box-shadow .2s}
body.scrolled .top::before{box-shadow:0 1px 0 var(--line),0 6px 16px rgba(0,0,0,.06)}
body.over-hero:not(.top-solid) .top::before{background:transparent;box-shadow:none}
html{scroll-padding-top:calc(var(--top-h,80px) + 8px)}
.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}
.brand:focus-visible{outline:2px solid var(--flag);outline-offset:4px;border-radius:8px}
.brand h1{font-size:21px}
.brand svg{flex:none}
.sample{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--slate);padding:6px 8px;border-radius:4px}

/* Trip switcher */
.trips{display:flex;gap:8px;flex-wrap:wrap;padding-block:4px 16px}
.trip-chip{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:8px;padding:10px 14px;cursor:pointer;text-align:left}
.trip-chip strong{font-family:var(--display);font-size:16px;font-weight:700}
.trip-chip[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent),var(--card-shadow)}
.pill{display:inline-block;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:3px}
.pill.done{background:var(--soft);color:var(--muted)}
.pill.next{background:var(--flag);color:var(--flag-ink)}

/* Hero band */
/* Full-width trip header; its content stays in the page container. Past trips show a trip photo with the cars behind it. */
.hero{position:relative;margin-inline:calc(50% - 50vw);margin-bottom:28px;padding:44px 16px;color:#F2F5F8;background:var(--road);background-size:cover;background-position:var(--hero-pos,center)}
.hero.has-img{background-image:linear-gradient(0deg,rgba(20,27,33,.82) 0%,rgba(20,27,33,.66) calc(100% - var(--hero-top) - 170px),rgba(20,27,33,.22) calc(100% - var(--hero-top) + 10px),rgba(20,27,33,0) 100%),var(--hero-img);--hero-top:clamp(260px,50vh,600px);padding-block:var(--hero-top) 40px}
.hero.has-img .hero-in{width:100%;align-items:end}
.hero-in{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center}
.hero.has-img h2,.hero.has-img p,.hero.has-img .stat,.hero.has-img .label{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.35)}
.hero h2{font-size:clamp(28px,4.8vw,45px)}
/* Trip titles (Tom 2026-10-09): own title, season + year as the subtitle */
.hero .hsub{margin-top:6px;font:600 clamp(16px,2vw,20px)/1.2 var(--display);color:#E3EAF0;letter-spacing:.01em}
.hero .label{color:#B8C5D1}
.hero.has-img .label{color:#E2E8EE}
.hero p{margin:10px 0 0;max-width:52ch;color:#C9D3DD}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;align-content:center}
.stat .v{font:500 23px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:#9FB0C2;margin-left:3px}
.countdown{color:var(--flag)}
.hero .countdown{color:var(--hero-hi)}

/* Tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:20px 16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--flag)}

/* Roads */
.stages{display:grid;gap:14px}
.stage{background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;display:grid;grid-template-columns:72px 1fr 260px;gap:16px;padding:16px;align-items:center}
.day{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--accent);text-align:center}
.day span{display:block;font:500 12px/1 var(--mono);letter-spacing:.12em;color:var(--muted);margin-bottom:4px}
.stage h3{font-size:17px}
.stage .route{color:var(--muted);font-size:14px;margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px}
.facts b{font-family:var(--mono);font-weight:500}
.passes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pass{font:500 12px/1 var(--mono);background:var(--soft);padding:6px 8px;border-radius:4px}
.pass em{font-style:normal;color:var(--muted)}
.profile svg{width:100%;height:auto;display:block}
.profile .cap{display:flex;justify-content:space-between;margin-top:4px}
.stage-links{display:flex;gap:12px;margin-top:10px;font-size:12px}
.rating{color:var(--flag);letter-spacing:2px}

/* Photos */
.photo-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.photo{margin:0;background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;overflow:hidden}
.photo .img{background:var(--soft);aspect-ratio:4/3;max-width:100%;display:block;width:100%;object-fit:cover}
.iday-photos{margin-top:16px;grid-column:1/-1;min-width:0}
.iday-photos-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.day-photos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.photo-open{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.photo-open:focus-visible{outline:2px solid var(--accent,#c60);outline-offset:-2px}
#lightbox{padding:0;border:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh;background:rgba(10,10,10,.94);color:#fff}
#lightbox::backdrop{background:rgba(0,0,0,.8)}
#lightbox .lb-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:48px 8px}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block}
#lightbox button{position:absolute;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;width:44px;height:44px;font-size:19px;cursor:pointer}
#lightbox button[hidden]{display:none}
#lightbox button:hover{background:rgba(255,255,255,.25)}
#lightbox [data-lb=close]{top:8px;right:8px}
#lightbox [data-lb=prev]{left:8px;top:50%;transform:translateY(-50%)}
#lightbox [data-lb=next]{right:8px;top:50%;transform:translateY(-50%)}
#lightbox .lb-count{position:absolute;top:18px;left:16px;font-size:12px;opacity:.8;font-family:var(--mono)}
.photo figcaption{padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;gap:8px}
.photo figcaption span:last-child{color:var(--muted);font-family:var(--mono);font-size:12px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn input{display:none}

/* Stories */
.stories{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.story{background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;padding:18px 20px}
.story + .story{margin-top:12px}
.story h3{font-size:23px;margin-top:6px}
.story-del{background:none;border:0;padding:4px;margin:-4px -4px -4px 4px;color:var(--muted);cursor:pointer;border-radius:6px;display:inline-flex}
.story-del:hover{color:#B3261E;background:var(--soft)}
.story-del.edit:hover{color:var(--ink)}
.story p{margin:8px 0 0;max-width:65ch}
.byline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--mono);background:var(--ink);color:var(--surface);flex:none}
.byline .who{font-weight:600;font-size:14px}
.byline .car{color:var(--muted);font-size:12px}
.compose{background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;padding:16px;display:grid;gap:10px;position:sticky;top:12px}
.compose label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.compose input,.compose textarea,.compose select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink)}
.compose textarea{min-height:110px;resize:vertical}
.s-picks{display:flex;flex-wrap:wrap;gap:6px}
.s-pick{position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;background:var(--soft)}
.s-pick img{width:100%;height:100%;object-fit:cover;display:block}
.s-pick button{position:absolute;top:2px;right:2px;width:20px;height:20px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:20px;padding:0;cursor:pointer}
.story-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:12px}
.story-photos button{border:0;padding:0;background:var(--soft);border-radius:6px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.story-photos img{width:100%;height:100%;object-fit:cover;display:block}
.note{font-size:12px;color:var(--muted)}

/* Crew */
.member .nick{font-weight:400;color:var(--muted)}
.tpick{position:absolute;z-index:5;top:20px;right:max(16px,calc(50% - 520px))}
.tpick-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px 8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(20,27,33,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#F2F5F8;font:600 15px/1.2 var(--body);cursor:pointer}
.tpick-btn .label{color:#C9D3DD;font-size:11px}
.tpick-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tpick-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
@media (hover:hover){.tpick-btn:hover{background:rgba(20,27,33,.72)}}
.tpick-list{position:absolute;right:0;top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));max-height:min(65vh,520px);overflow:auto;background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.12);padding:6px}
.tpick-year{padding:4px 0}.tpick-year + .tpick-year{border-top:1px solid var(--line)}
.hero .tpick-year > .label{display:block;padding:8px 10px 4px;color:var(--muted);text-shadow:none}
.hero .tpick-btn .label{text-shadow:none}
.tpick-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.tpick-opt strong{font-weight:600;font-size:15px}.tpick-opt span{font-size:12px;color:var(--muted)}
.tpick-opt[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
@media (hover:hover){.tpick-opt:hover{background:var(--soft)}}
.tpick-opt:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (max-width:640px){.tpick{top:12px}}
/* Hero under the top menu */
body.over-hero:not(.top-solid) .top{color:#F2F5F8}
body.over-hero:not(.top-solid) .brand svg rect{fill:rgba(255,255,255,.18)!important}
body.over-hero:not(.top-solid) .brand svg path{stroke:#fff!important}
body.over-hero:not(.top-solid) .brand h1{text-shadow:0 1px 3px rgba(0,0,0,.45)}
body.over-hero:not(.top-solid) .top-nav .sec{background:rgba(20,27,33,.45);border-color:rgba(255,255,255,.28);color:#E6ECF1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.over-hero:not(.top-solid) .top-nav .sec[aria-selected="true"]{background:#F2F5F8;color:#1E262C;border-color:#F2F5F8}
@media (hover:hover){body.over-hero:not(.top-solid) .top-nav .sec:not([aria-selected="true"]):hover{background:rgba(20,27,33,.7);color:#fff;border-color:rgba(255,255,255,.5)}}
body.over-hero #view > .hero.has-img:first-child{margin-top:calc(-1 * var(--top-h,80px));padding-top:calc(var(--hero-top) + var(--top-h,80px));background-image:linear-gradient(180deg,rgba(20,27,33,.55) 0,rgba(20,27,33,0) calc(var(--top-h,80px) + 70px)),linear-gradient(0deg,rgba(20,27,33,.82) 0%,rgba(20,27,33,.66) calc(100% - var(--hero-top) - var(--top-h,80px) - 170px),rgba(20,27,33,.22) calc(100% - var(--hero-top) - var(--top-h,80px) + 10px),rgba(20,27,33,0) 100%),var(--hero-img)}
body.over-hero #view > .hero.has-img:first-child .tpick{top:calc(var(--top-h,80px) + 16px)}
.vtag{display:inline-block;margin-right:6px;padding:2px 6px;border-radius:3px;background:var(--soft);font:500 10px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);vertical-align:1px}
.gvars{display:block;font-size:12px;margin-top:2px}
.cc-vars{margin:4px 0 12px}
.cc-mods{margin:6px 0 4px;padding-left:20px}.cc-mods li{margin:2px 0}
.vcount{display:block;font-size:12px;color:var(--muted);font-weight:400}
/* Fleet sort row (Tom 2026-10-06): label centred with the buttons, smaller buttons */
.fleet-sort{padding:0;align-items:center;gap:5px}
.fleet-sort .label{margin:0 4px 0 0;line-height:1}
.fleet-sort .sec{min-height:30px;padding:6px 11px;font-size:10.5px;letter-spacing:.06em}
/* Logout (Tom 2026-10-06): icon button top right, back to the password screen */
.top-nav{margin-left:auto}
.logout{flex:none;width:44px;height:44px;padding:0;display:inline-grid;place-items:center;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
@media (hover:hover){.logout:hover{background:var(--soft);color:var(--ink);border-color:var(--muted)}}
.logout:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
body.over-hero:not(.top-solid) .logout{background:rgba(20,27,33,.45);border-color:rgba(255,255,255,.28);color:#E6ECF1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
@media (hover:hover){body.over-hero:not(.top-solid) .logout:hover{background:rgba(20,27,33,.7);color:#fff;border-color:rgba(255,255,255,.5)}}
@media (max-width:640px){.top-nav{order:2;margin-left:0}.logout{order:1;margin-left:auto}}
/* Password gate */
html.locked .wrap{display:none}
html:not(.locked) #gate{display:none}
html.guest #compose,html.guest .story-del{display:none!important}
#gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 0}
.gate-card{width:min(360px,100%);display:grid;gap:10px;background:var(--surface);box-shadow:var(--card-shadow);border-radius:14px;padding:28px 24px;text-align:left}
.gate-card h1{font-size:24px;margin:2px 0 0}.gate-card p{margin:0 0 6px}
.gate-card input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate-card .btn{justify-content:center}
#gate-msg:empty{display:none}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.driver{background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;padding:16px;display:grid;gap:10px}
.driver .num{font-family:var(--display);font-weight:700;font-size:31px;line-height:.9;color:var(--accent)}
.driver .model{font-weight:600}
.spec{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px}
.spec div{display:grid;gap:3px}
.spec b{font:500 14px/1 var(--mono)}

/* Plan */
.plan{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;padding:18px}
.checklist{padding:12px 16px}.checklist ul{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0 16px}
.checklist label{display:flex;align-items:center;gap:8px;min-height:34px;cursor:pointer;font-size:14px}
.checklist input{width:16px;height:16px;margin:0;accent-color:var(--ink);flex:none}
.checklist input:checked + span{color:var(--muted);text-decoration:line-through}
.checklist .note{margin:6px 0 0;font-size:12px}
.check-group + .check-group{margin-top:14px}
.panel h3{font-size:16px;margin-bottom:10px}

.sections{gap:8px}
.top{padding-block:20px 18px}.top-nav{padding:0}
@media (max-width:640px){.top-nav{flex:1 1 100%;flex-wrap:nowrap;gap:6px}.top-nav .sec{flex:1 1 auto;border-radius:12px;padding:6px 8px;letter-spacing:.04em;line-height:1.2;white-space:normal;text-align:center}}
.route-link,.linkish,.gcar .model{display:inline-flex;align-items:center;min-height:44px}
.meet-card dd a{display:inline-flex;align-items:center;min-height:44px;margin-block:-12px}
/* Compact trip badges; the invisible ::after keeps a ~44px tap area. */
.tag{position:relative;min-height:20px;display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.04em;padding:2px 6px}
button.tag::after{content:"";position:absolute;inset:-12px -3px}
.gcar .tags,.cc-trips,.member-tags{gap:6px}
.zctl button{width:44px;height:44px}
.zctl{gap:8px}
.lb-stage img{touch-action:pinch-zoom}
.rsvp-row > span:nth-child(2){white-space:nowrap}
.rsvp-row .car{min-width:0}
/* Subtle hover on buttons (pointer devices only) */
.sec,.btn,.ibtn,.tag,.tab,.trip-chip,.pmap-zoom button,.zctl button,.story-del,.linkish,.gcar .model,.driver .model{transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s,filter .15s}
@media (hover:hover){
  .sec:not([aria-selected="true"]):hover{background:var(--soft);color:var(--ink);border-color:var(--muted)}
  .sec[aria-selected="true"]:hover{filter:brightness(1.15)}
  .btn:not(:disabled):hover,.ibtn.primary:hover{filter:brightness(1.12)}
  .btn.ghost:not(:disabled):hover{filter:none;background:var(--soft);border-color:var(--muted)}
  .ibtn:not(.primary):hover,.pmap-zoom button:hover{background:var(--soft);border-color:var(--muted)}
  button.tag:hover{background:var(--line)}
  .tab:not([aria-selected="true"]):hover{color:var(--ink);background:var(--soft);border-radius:6px 6px 0 0}
  .trip-chip:not([aria-pressed="true"]):hover{box-shadow:inset 0 0 0 1px var(--line),var(--card-shadow)}
  .zctl button:hover{background:#EEF1F4}
  .linkish:hover,.gcar .model:hover,.driver .model:hover{color:var(--ink);text-decoration-color:currentColor}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* Místa: live OSM map + list */
.pmap{position:relative;height:min(60vh,460px);min-height:280px;border:0;box-shadow:var(--card-shadow);border-radius:10px;overflow:hidden;background:#E8E4DC;touch-action:none;cursor:grab;user-select:none}
.pmap:active{cursor:grabbing}
.pmap-tiles,.pmap-pins{position:absolute;inset:0;transform-origin:0 0}
.pmap-tiles img{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none}
:root[data-theme="dark"] .pmap-tiles img{filter:brightness(.8) contrast(1.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pmap-tiles img{filter:brightness(.8) contrast(1.1)}}
.ppin{position:absolute;width:34px;height:34px;margin:-36px 0 0 -17px;border:0;padding:0;background:none;cursor:pointer}
.ppin span{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.ppin svg{transform:rotate(45deg);width:19px;height:19px;fill:none;stroke:var(--t,#fff);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ppin.sel span{outline:3px solid var(--ink);outline-offset:1px}
.pmap-zoom{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.pmap-zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.pmap-attr{position:absolute;right:0;bottom:0;background:rgba(255,255,255,.85);color:#333;font-size:11px;padding:2px 6px;border-top-left-radius:6px}
.pmap-attr a{color:#333}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin-top:12px;align-items:start}
.place{background:var(--surface);border:0;box-shadow:var(--card-shadow);border-radius:10px;padding:10px;display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:start}
.place.sel{box-shadow:inset 0 0 0 2px var(--accent),var(--card-shadow)}
.place-pic{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--surface));display:flex;align-items:center;justify-content:center;color:var(--i,var(--c))}
.place-pic img{width:100%;height:100%;object-fit:cover}
/* Dark mode: lighter icon and stronger tile tint so brown/blue icons stay readable. */
:root[data-theme="dark"] .place-pic{color:color-mix(in srgb,var(--c) 55%,#fff);background:color-mix(in srgb,var(--c) 28%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .place-pic{color:color-mix(in srgb,var(--c) 55%,#fff);background:color-mix(in srgb,var(--c) 28%,var(--surface))}}
.place-pic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.place-pic .pnum{position:absolute;left:3px;top:3px;width:20px;height:20px;font-size:11px;border:1.5px solid #fff}
.place-body{min-width:0;display:flex;flex-direction:column;gap:3px}
.place h4{margin:0;font-size:15px;line-height:1.25}
.place p{margin:0;font-size:13px;color:var(--muted)}
.place-meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.place-meta .label{font-size:10.5px}
.place-addr{font-size:12.5px;color:var(--muted);line-height:1.35}
.place-addr:empty{display:none}
.pnum{flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700}
.place .tags{display:flex;flex-wrap:wrap;gap:4px}
.place-actions{display:flex;gap:6px;margin-top:4px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
</style>

// Whole calendar days until departure day, so Wednesday → Friday reads as 2.
function daysLeft(t){ const d = new Date(t.depart), n = new Date(); const day = x => Date.UTC(x.getFullYear(), x.getMonth(), x.getDate()); return Math.max(0, Math.round((day(d) - day(n))/864e5)); }

/* Mapy.cz route links: built from stop coordinates, or a link someone pasted */
const MAPY = "https://mapy.com/fnc/v1/route";
function mapyRoute(pts){
  const u = [...new Set(pts.filter(Boolean))];
  if (u.length < 2) return "";
  const mid = u.slice(1,-1).slice(0,15);
  return `${MAPY}?start=${u[0]}&end=${u[u.length-1]}${mid.length?`&waypoints=${mid.join(";")}`:""}&routeType=car_fast`;
}
const dayPts = d => (d.stops || (d.variants ? d.variants[varSel(d)].stops : [])).map(s => s[4]);
const tripPts = t => { const all = t.days.flatMap(dayPts).filter(Boolean); const u = [...new Set(all)]; return u.length > 17 ? [u[0], ...u.slice(1,-1).filter((_,i,a)=>i % Math.ceil(a.length/15) === 0), u[u.length-1]] : u; };
const store = { get(k){ try{ return localStorage.getItem(k) || ""; }catch(_){ return ""; } }, set(k,v){ try{ v ? localStorage.setItem(k,v) : localStorage.removeItem(k); }catch(_){} } };
const routeKey = (t,d) => `route:${t.storeId||t.id}:${d==null?"trip":d}`;
const routeFor = (t,d) => store.get(routeKey(t,d)) || (d==null ? mapyRoute(tripPts(t)) : mapyRoute(dayPts(t.days[d-1])));
const isMapy = v => { try{ const u = new URL(v); return /(^|\.)mapy\.(cz|com)$/.test(u.hostname) && u.protocol === "https:"; }catch(_){ return false; } };
function routeBox(t,d){
  const own = !!store.get(routeKey(t,d));
  const id = `r-${d==null?"trip":d}`;
  const href = routeFor(t,d);
  return `<div class="route-box">
    ${href ? `<a class="route-link" href="${esc(href)}" target="_blank" rel="noopener">${d==null?"Celý trip":"Trasa"} v Mapy.cz ↗</a>
    <span class="label">${own?"Tvůj odkaz":"Automaticky ze zastávek"}</span>` : `<span class="label">Zatím bez trasy</span>`}
    <button class="linkish" type="button" data-edit-route="${d==null?"trip":d}">${own?"Změnit":"Vložit vlastní odkaz z Mapy.cz"}</button>
    <form class="route-form" data-route-form="${d==null?"trip":d}" hidden>
      <label class="sr" for="${id}">Odkaz na trasu v Mapy.cz</label>
      <input id="${id}" type="url" placeholder="https://mapy.com/s/…" value="${own?esc(store.get(routeKey(t,d))):""}">
      <button class="btn" type="submit">Uložit</button>
      ${own?`<button class="btn ghost" type="button" data-reset-route="${d==null?"trip":d}">Obnovit</button>`:""}
      <span class="note route-err" aria-live="polite"></span>
    </form>
  </div>`;
}

// Crew status "out" marks a driver (and their car) who is not going; codriversOut lists co-drivers who are not going.
const carOut = (t,k) => t.crew.some(c => c[1]===k && c[2]==="out");
const coOut = (t,n) => (t.codriversOut||[]).includes(n);
function tripCars(t){
  const ks = (t.cars||[]).filter(k => CARS[k]).sort((a,b) => carOut(t,a) - carOut(t,b));
  return ks.length ? `<div class="trip-cars"><span class="label">${t.status==="next"?"Auta, která jedou":"Auta na tripu"}</span>${ks.map(k => carOut(t,k) ? `<button class="trip-car out" data-car="${k}" aria-label="${esc(CARS[k].m)}, nejede">${carThumb(CARS[k])}<span><s>${esc(CARS[k].m)}</s><small>Nejede</small></span></button>` : CARS[k].planned ? `<button class="trip-car plan" data-car="${k}" aria-label="${esc(CARS[k].m)}, ${PLAN_LABEL.toLowerCase()}">${carThumb(CARS[k])}<span>${esc(CARS[k].m)}<small>${PLAN_LABEL}</small></span></button>` : `<button class="trip-car" data-car="${k}">${carThumb(CARS[k])}<span>${esc(CARS[k].m)}</span></button>`).join("")}</div>` : "";
}
// People on a trip (past or next): drivers from crew (or the owners of the trip's cars when crew isn't recorded), then co-drivers.
const tripNames = t => t.people ? [...t.people] : [...new Set([...(t.crew.length ? t.crew.filter(c => c[2]!=="out").map(c => c[0]) : (t.cars||[]).map(ownerOf).filter(Boolean)), ...(t.codrivers||[]).filter(n => !coOut(t,n))])];
function tripPeople(t){
  if (t.people) return t.people.length ? `<div class="trip-cars trip-people"><span class="label">Posádka · ${t.people.length} ${pl(t.people.length,"člověk","lidé","lidí")}</span>${t.people.map(n => `<span class="trip-person" title="${esc(n)}">${avatar(n)}<span>${esc(nick(n))}</span></span>`).join("")}</div>` : "";
  const drivers = t.crew.length ? t.crew.filter(c => c[2]!=="out").map(c => c[0]) : (t.cars||[]).map(ownerOf).filter(Boolean);
  const people = [...new Set(drivers)].map(n => [n, "Řidič"]);
  (t.codrivers||[]).filter(n => !coOut(t,n) && !people.some(p => p[0]===n)).forEach(n => people.push([n, "Spolujezdec"]));
  return people.length ? `<div class="trip-cars trip-people"><span class="label">Posádka · ${people.length} ${pl(people.length,"člověk","lidé","lidí")}</span>${people.map(([n,role]) => `<span class="trip-person" title="${esc(n)}">${avatar(n)}<span>${esc(nick(n))}<small>${role}</small></span></span>`).join("")}</div>` : "";
}

// Open-Meteo's daily weather_code is the most severe hour of the day, so a dry day with one cloudy hour reads "Zataženo".
// For dry days derive the sky from the sunshine share of daylight (or mean cloud cover) when the snapshot has it.
const dayCode = (f,k) => { const c = f.weather_code[k]; if (c >= 45) return c;
  const sun = f.sunshine_duration && f.daylight_duration ? f.sunshine_duration[k] / f.daylight_duration[k] : null, cc = f.cloud_cover_mean ? f.cloud_cover_mean[k] : null;
  if (sun != null) return sun > .85 ? 0 : sun > .6 ? 1 : sun > .3 ? 2 : 3;

const WX_SNAPSHOT = null;
const tripDate = (t,d) => { const x = new Date(t.depart); x.setDate(x.getDate()+d-1); return x.toISOString().slice(0,10); };
// Compact forecast strip shown inside each itinerary day.
function dayWeather(t, day){
  const pts = t.weather || [], ws = pts.filter(w => w.d === day.d); if (!ws.length) return "";
  const at = WX_SNAPSHOT ? new Date(WX_SNAPSHOT.at).toLocaleString("cs",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
  return `<section class="wx" aria-label="Počasí, den ${day.d}"><div class="wx-head"><span class="label">Počasí</span><span class="note">${at ? `Open-Meteo · stav k ${at}` : "Předpověď doplníme brzy."}</span></div>${ws.map(w => {
    const i = pts.indexOf(w), f = WX_SNAPSHOT && WX_SNAPSHOT.data[i] && WX_SNAPSHOT.data[i].daily, k = f ? f.time.indexOf(tripDate(t,day.d)) : -1;
    const body = k >= 0
      ? `${wxIcon(dayCode(f,k))}<span class="wx-t">${Math.round(f.temperature_2m_max[k])}°<small>/${Math.round(f.temperature_2m_min[k])}°</small></span>
         <span class="wx-m">${WX_TEXT(dayCode(f,k))} · ${f.precipitation_sum[k].toLocaleString("cs",{maximumFractionDigits:1})} mm${f.precipitation_probability_max[k]!=null?` (${f.precipitation_probability_max[k]} %)`:""} · vítr ${Math.round(f.wind_speed_10m_max[k])} km/h</span>`
      : `<span class="wx-m">${WX_SNAPSHOT ? "Pro tento den zatím není." : ""}</span>`;
    const vis = !w.v || w.v.includes(varSel(day));
    return `<div class="wx-row"${w.v?` data-v="${w.v.join(",")}"`:""}${vis?"":" hidden"}><span class="wx-place">${esc(w.n)}<small>${esc(w.x)}</small></span>${body}<a class="wx-link" href="${meteoblue(w)}" target="_blank" rel="noopener" aria-label="Předpověď pro ${esc(w.n)} v Meteoblue">↗</a></div>`;

}

// Day-by-day itinerary: the next trip, and finished trips planned the same way (Podzim 2026 on).
function itinHTML(t){ return `<div class="itin">${t.days.map(d => itinDay(t, d)).join("")}</div>`; }
// One itinerary day: a collapsible card, or (solo) the open day on a trip's day tab.
function itinDay(t, d, solo){
      const vs = d.variants || null, kms = vs ? vs.map(v=>v.km).filter(Boolean) : [];
      const kmTxt = kms.length > 1 ? `${fmt(Math.min(...kms))}–${fmt(Math.max(...kms))} km` : d.km ? `${fmt(d.km)} km` : "";
      const W = solo ? "section" : "details", Sm = solo ? "div" : "summary";
      return `
      <${W} class="iday-wrap${solo?" solo":""}" data-iday="${t.id}:${d.d}"${!solo && openDays.has(`${t.id}:${d.d}`)?" open":""}>
        <${Sm} class="iday-sum"><span class="iday-no"><b>Den ${d.d}</b></span><h4>${esc(d.t)}</h4>
          <span class="meta">${esc(d.date)}${kmTxt?` · ${kmTxt}`:""}${vs && vs.length > 1 ? ` · ${vs.length} ${pl(vs.length,"varianta","varianty","variant")}`:""}</span>${solo?"":`<span class="chev" aria-hidden="true"></span>`}</${Sm}>

// SVG presentation attributes can't use CSS variables in some browsers (Safari), so resolve colours to real values.
const V = n => { try { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888"; } catch(_) { return "#888"; } };
const STAGE_VARS = ["--s1", "--s2", "--s3"];
const SC = i => V(STAGE_VARS[i % STAGE_VARS.length]);
const MONO = "Inter, system-ui, sans-serif";

function profileSVG(pts, color){
  const W=260,H=90,P=6;
  const lo = Math.floor(Math.min(...pts)/100)*100, hi = Math.max(lo+200, Math.ceil(Math.max(...pts)/100)*100);
  const x = i => P + i*(W-2*P)/(pts.length-1);
  const y = v => H-P - (v-lo)/(hi-lo)*(H-2*P-10);
  const line = pts.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const top = Math.max(...pts), ti = pts.indexOf(top);
  const c = color || V("--accent");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Výškový profil od ${pts[0]} do ${pts[pts.length-1]} m n. m., nejvyšší bod ${top} m n. m.">
    <line x1="${P}" x2="${W-P}" y1="${y(hi)}" y2="${y(hi)}" stroke="${V("--line")}" stroke-dasharray="3 3"/>
    <text x="${W-P}" y="${y(hi)-3}" text-anchor="end" font-size="9" font-family="${MONO}" fill="${V("--muted")}">${fmt(hi)} m</text>
    <line x1="${P}" x2="${W-P}" y1="${y(lo)}" y2="${y(lo)}" stroke="${V("--line")}"/>
    <text x="${W-P}" y="${y(lo)-3}" text-anchor="end" font-size="9" font-family="${MONO}" fill="${V("--muted")}">${fmt(lo)} m</text>
    <polygon points="${P},${y(lo)} ${line} ${W-P},${y(lo)}" fill="${c}" opacity=".15"/>
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(ti)}" cy="${y(top)}" r="3.5" fill="${c}"/>
  </svg>`;
}

function dayMapSVG(stages){
  return routeSVG(stages.filter(s => TRACKS[s.n]).map((s,i) => ({line:TRACKS[s.n].line, color:SC(i), mark:s.n})), "Mapa: " + stages.map(s=>s.t).join(", "));
}
// Plain line map (no tiles): segs = [{line:[[lon,lat],…], color, mark}], a numbered marker at each mark, square at the finish.
function routeSVG(segs, aria){
  const trs = segs;
  const all = trs.flatMap(t => t.line);
  const lat0 = all.reduce((a,p)=>a+p[1],0)/all.length, k = Math.cos(lat0*Math.PI/180);
  const xs = all.map(p=>p[0]*k), ys = all.map(p=>p[1]);
  const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
  const W=640, P=36, sc = (W-2*P)/Math.max(maxX-minX, 1e-6);
  const H = Math.max(260, Math.min(420, Math.round((maxY-minY)*sc + 2*P)));
  const s2 = Math.min(sc, (H-2*P)/Math.max(maxY-minY,1e-6));

  const grid = [];

  for (let g=Math.ceil((minX/k-.3)*10)/10; g<=maxX/k+.3; g+=.1) grid.push(`<line y1="0" y2="${H}" x1="${X(g).toFixed(1)}" x2="${X(g).toFixed(1)}"/>`);

  const kmPerUnit = 111.32; const pxPerKm = s2/kmPerUnit;

const ZOOM_MAPS = {1: [{"z":11,"zmin":8,"file":"day1-tiles-8-11.json"},{"z":12,"x0":2223,"x1":2239,"file":"day1-z12.json"},{"z":13,"x0":4446,"x1":4479,"file":"day1-z13.json"},{"z":14,"x0":8894,"x1":8908,"file":"day1-z14-1.json"},{"z":14,"x0":8908,"x1":8918,"file":"day1-z14-2.json"},{"z":14,"x0":8918,"x1":8934,"file":"day1-z14-3.json"},{"z":14,"x0":8934,"x1":8940,"file":"day1-z14-4.json"},{"z":14,"x0":8940,"x1":8954,"file":"day1-z14-5.json"},{"z":14,"x0":8954,"x1":8957,"file":"day1-z14-6.json"},{"z":15,"x0":17790,"x1":17805,"file":"day1-z15-1.json"},{"z":15,"x0":17805,"x1":17817,"file":"day1-z15-2.json"},{"z":15,"x0":17817,"x1":17823,"file":"day1-z15-3.json"},{"z":15,"x0":17823,"x1":17836,"file":"day1-z15-4.json"},{"z":15,"x0":17836,"x1":17852,"file":"day1-z15-5.json"},{"z":15,"x0":17852,"x1":17867,"file":"day1-z15-6.json"},{"z":15,"x0":17867,"x1":17873,"file":"day1-z15-7.json"},{"z":15,"x0":17874,"x1":17880,"file":"day1-z15-8.json"},{"z":15,"x0":17880,"x1":17886,"file":"day1-z15-9.json"},{"z":15,"x0":17886,"x1":17897,"file":"day1-z15-10.json"},{"z":15,"x0":17897,"x1":17913,"file":"day1-z15-11.json"}], 2: [{"z":11,"zmin":8,"file":"day2-tiles-8-11.json"},{"z":12,"x0":2238,"x1":2244,"file":"day2-z12.json"},{"z":13,"x0":4476,"x1":4490,"file":"day2-z13.json"},{"z":14,"x0":8954,"x1":8964,"file":"day2-z14-1.json"},{"z":14,"x0":8964,"x1":8973,"file":"day2-z14-2.json"},{"z":14,"x0":8973,"x1":8980,"file":"day2-z14-3.json"},{"z":15,"x0":17909,"x1":17922,"file":"day2-z15-1.json"},{"z":15,"x0":17922,"x1":17927,"file":"day2-z15-2.json"},{"z":15,"x0":17927,"x1":17939,"file":"day2-z15-3.json"},{"z":15,"x0":17939,"x1":17945,"file":"day2-z15-4.json"},{"z":15,"x0":17945,"x1":17956,"file":"day2-z15-5.json"},{"z":15,"x0":17956,"x1":17960,"file":"day2-z15-6.json"}]};
const ZM_MIN = 8, ZM_MAX = 15.5, ZT_MAX = 15;
const zmTiles = new Map(), zmBundles = new Map(), zmRoutes = {};
function zmLoad(day, b){
  const k = b.file;
  if (!zmBundles.has(k)) zmBundles.set(k, fetch(k).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => {
    if (j.routes) zmRoutes[day] = j.routes;
    for (const [key, src] of Object.entries(j)) if (key !== "routes") { const im = new Image(); im.src = src; zmTiles.set(key, im); }
    return true;
  }).catch(e => { zmBundles.delete(k); throw e; }));
  return zmBundles.get(k);
}
const zmWorld = (lon, lat) => { const s = Math.sin(lat*Math.PI/180); return [(lon+180)/360, .5 - Math.log((1+s)/(1-s))/(4*Math.PI)]; };

function initZoomMaps(){
  document.querySelectorAll(".zmap").forEach(box => {
    const day = +box.dataset.day, bundles = ZOOM_MAPS[day];
    const img = box.querySelector("img"), cv = box.querySelector("canvas"), ctx = cv.getContext("2d");
    const colors = [0,1,2].map(SC), ink = "#141A22";
    let W = 0, H = 0, dpr = 1, st = null, raf = 0;
    const lines = () => (zmRoutes[day] || (box.dataset.stages||"").split(",").map(n => (TRACKS[n]||{}).line).filter(Boolean)).map(l => l.map(p => zmWorld(p[0], p[1])));
    let world = [];
    function fit(){
      const all = world.flat(); if (!all.length) return;
      const xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
      const w = Math.max(...xs)-Math.min(...xs), h = Math.max(...ys)-Math.min(...ys);
      const z = Math.log2(Math.min(W*.88/w, H*.88/h)/256);
      st = {x:(Math.max(...xs)+Math.min(...xs))/2, y:(Math.max(...ys)+Math.min(...ys))/2, z:Math.max(ZM_MIN, Math.min(ZM_MAX, z))};
    }
    function size(){
      const r = box.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
      W = r.width; H = r.height; cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
      if (!st) fit(); draw();
    }
    // tile level for the current zoom, sharper on high-density screens
    const level = () => Math.max(ZM_MIN, Math.min(ZT_MAX, Math.round(st.z + Math.log2(dpr))));
    function ensure(){
      const tz = level(), S = 256*Math.pow(2, st.z), ox = st.x*S - W/2;
      bundles.forEach(b => {
        if (zmBundles.has(b.file) || b.zmin || (b.z !== tz && b.z !== tz-1)) return;
        const ts = S/Math.pow(2, b.z);
        if (b.x1 < Math.floor(ox/ts) || b.x0 > Math.floor((ox+W)/ts)) return;
        zmLoad(day, b).then(draw, () => {});
      });
    }
    function tile(z, x, y){ const im = zmTiles.get(`${z}/${x}/${y}`); return im && im.complete && im.naturalWidth ? im : null; }
    function draw(){
      if (raf || !st) return;
      raf = requestAnimationFrame(() => { raf = 0; paint(); });
    }
    function paint(){
      ensure();
      const S = 256*Math.pow(2, st.z), ox = st.x*S - W/2, oy = st.y*S - H/2;
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle = "#F2EFE9"; ctx.fillRect(0,0,W,H);
      const tz = level(), n = Math.pow(2, tz), ts = S/n;
      ctx.imageSmoothingQuality = "high";
      for (let tx = Math.floor(ox/ts); tx*ts < ox+W; tx++) for (let ty = Math.floor(oy/ts); ty*ts < oy+H; ty++){
        const dx = tx*ts-ox, dy = ty*ts-oy;
        let im = tile(tz, tx, ty);
        if (im){ ctx.drawImage(im, dx, dy, ts+.5, ts+.5); continue; }
        // fall back to a lower-zoom tile, cropped and scaled up
        for (let pz = tz-1; pz >= ZM_MIN; pz--){
          const f = Math.pow(2, tz-pz), px = Math.floor(tx/f), py = Math.floor(ty/f); im = tile(pz, px, py);
          if (im){ const sw = 256/f; ctx.drawImage(im, (tx-px*f)*sw, (ty-py*f)*sw, sw, sw, dx, dy, ts+.5, ts+.5); break; }
        }
      }
      const P = p => [p[0]*S-ox, p[1]*S-oy];
      ctx.lineJoin = ctx.lineCap = "round";
      const wid = Math.max(4, Math.min(9, st.z-5));
      [["#fff", wid+5], [null, wid]].forEach(([c, lw]) => world.forEach((l, i) => {
        ctx.beginPath(); l.forEach((p, j) => { const [x,y] = P(p); j ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
        ctx.strokeStyle = c || colors[i%3]; ctx.lineWidth = lw; ctx.stroke();
      }));
      ctx.font = "700 13px Inter, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      world.forEach((l, i) => { const [x,y] = P(l[0]);
        ctx.beginPath(); ctx.arc(x, y, 12, 0, 7); ctx.fillStyle = colors[i%3]; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.fillText(box.dataset.stages.split(",")[i] || i+1, x, y+.5); });
      if (world.length){ const [x,y] = P(world.at(-1).at(-1)); ctx.fillStyle = ink; ctx.strokeStyle = "#fff"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.rect(x-9, y-9, 18, 18); ctx.fill(); ctx.stroke(); }
      // scale bar
      const mpp = 156543.03*Math.cos(50.4*Math.PI/180)/Math.pow(2, st.z);
      const km = [.5,1,2,5,10,20,50].find(v => v*1000/mpp >= 70) || 50, bw = km*1000/mpp;
      ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(10, H-34, bw+64, 24);
      ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(18, H-26); ctx.lineTo(18, H-18); ctx.lineTo(18+bw, H-18); ctx.lineTo(18+bw, H-26); ctx.stroke();
      ctx.fillStyle = ink; ctx.font = "12px Inter, system-ui, sans-serif"; ctx.textAlign = "left"; ctx.fillText(`${km} km`, 24+bw, H-21);
    }
    function zoomAt(dz, sx, sy){
      const z2 = Math.max(ZM_MIN, Math.min(ZM_MAX, st.z+dz)); if (z2 === st.z) return;
      const S = 256*Math.pow(2, st.z), S2 = 256*Math.pow(2, z2);
      const wx = st.x + (sx-W/2)/S, wy = st.y + (sy-H/2)/S;
      st = {x: wx - (sx-W/2)/S2, y: wy - (sy-H/2)/S2, z: z2}; draw();
    }
    const pts = new Map(); let pinch = null;
    cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.offsetX, e.offsetY]); pinch = null; });
    cv.addEventListener("pointermove", e => {
      const prev = pts.get(e.pointerId); if (!prev) return;
      const cur = [e.offsetX, e.offsetY];
      if (pts.size === 1){ const S = 256*Math.pow(2, st.z); st.x -= (cur[0]-prev[0])/S; st.y -= (cur[1]-prev[1])/S; pts.set(e.pointerId, cur); draw(); return; }
      pts.set(e.pointerId, cur);
      const [a, b] = [...pts.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]), m = [(a[0]+b[0])/2, (a[1]+b[1])/2];
      if (pinch){ const S = 256*Math.pow(2, st.z); st.x -= (m[0]-pinch.m[0])/S; st.y -= (m[1]-pinch.m[1])/S; zoomAt(Math.log2(d/pinch.d), m[0], m[1]); draw(); }
      pinch = {d, m};
    });
    const up = e => { pts.delete(e.pointerId); pinch = null; };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
    cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(-e.deltaY*(e.deltaMode ? .05 : .002), e.offsetX, e.offsetY); }, {passive:false});
    cv.addEventListener("dblclick", e => zoomAt(1, e.offsetX, e.offsetY));
    box.querySelector(".zctl").addEventListener("click", e => {
      const b = e.target.closest("[data-zm]"); if (!b) return; e.stopPropagation();
      if (b.dataset.zm === "fit"){ fit(); draw(); } else zoomAt(b.dataset.zm === "in" ? 1 : -1, W/2, H/2);
    });
    zmLoad(day, bundles[0]).then(() => {
      world = lines(); box.classList.add("live"); cv.hidden = false;
      new ResizeObserver(size).observe(box);
    }, () => {}); // bundle unavailable: the static picture stays
  });
}

function photoSVG(hue, seed){
  const r = n => { const v = Math.sin(seed*99+n)*10000; return v - Math.floor(v); };
  const peaks = Array.from({length:6},(_,i)=>`${i*80},${120 - r(i)*70}`).join(" ");
  const peaks2 = Array.from({length:6},(_,i)=>`${i*80+40},${170 - r(i+9)*50}`).join(" ");
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue},55%,72%)"/><stop offset="1" stop-color="hsl(${hue+20},40%,88%)"/></linearGradient></defs>
    <rect width="400" height="300" fill="url(#g)"/>
    <polygon points="0,300 ${peaks} 400,300" fill="hsl(${hue},25%,45%)"/>
    <polygon points="0,300 ${peaks2} 400,300" fill="hsl(${hue},22%,30%)"/>
    <path d="M-10 290 C120 250 160 230 200 215 S300 190 410 175" stroke="hsl(${hue},10%,18%)" stroke-width="16" fill="none"/>
    <path d="M-10 290 C120 250 160 230 200 215 S300 190 410 175" stroke="#fff" stroke-width="1.5" stroke-dasharray="10 10" fill="none" opacity=".7"/>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

// Thumbnail pack for a trip (one JSON of data URIs), loaded once; re-renders when it arrives.
function thumbPack(t){

  if (!THUMBS[t.id] && !THUMBS["_"+t.id]) THUMBS["_"+t.id] = fetch(t.thumbPack).then(r => r.json()).then(j => { THUMBS[t.id] = j; render(); }).catch(() => { THUMBS[t.id] = {}; });

}

// Shrink to max 1600 px on the long side; WebP where the browser can encode it, else JPEG.
function shrinkPhoto(file){
  return createImageBitmap(file).then(bmp => {
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height)), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return new Promise(res => c.toBlob(b => b && b.type === "image/webp" ? res(b) : c.toBlob(res, "image/jpeg", 0.85), "image/webp", 0.82));
  });
}

    .then(({ok, j}) => {

const hasRoads = t => t.stages.length > 0 || (Array.isArray(t.days) && t.days.length > 0);

// Lines of a trip's days for the whole-trip map: from stage tracks (TRACKS) or DAY_LINES (itinerary trips, chosen variant).
function tripDayInfo(t){
  return tripDays(t).map((d,i) => {
    if (Array.isArray(t.days) && t.days.length){
      const day = t.days.find(x => x.d === d), vs = day.variants, v = vs ? vs[varSel(day)] : day;
      const ln = ((DAY_LINES[t.id]||{})[d]||[])[vs ? varSel(day) : 0];
      return {d, date:day.date, title:day.t, km:v.km, climb:v.climb, lines: ln ? [ln] : [], sub: vs && vs.length > 1 ? v.t : ""};
    }
    const st = t.stages.filter(s => s.d === d), trs = st.map(s => TRACKS[s.n]).filter(Boolean), ns = st.map(s => s.n);
    return {d, date:st[0].date, title: ns.length > 1 ? `Etapy ${ns[0]}–${ns[ns.length-1]}` : `Etapa ${ns[0]}`, km: trs.length ? Math.round(trs.reduce((a,x)=>a+x.km,0)) : 0,
      climb: trs.reduce((a,x)=>a+x.climb,0), lines: trs.map(x => x.line), sub: st.length > 1 ? `${st.length} ${pl(st.length,"etapa","etapy","etap")}` : ""};
  });
}

const tripYear = t => +((t.when.match(/(19|20)\d\d/g) || [""]).pop()) || 0;

function tpickOpen(open, focus){
  const w = document.querySelector(".tpick"); if (!w) return;
  const btn = w.querySelector(".tpick-btn"), list = w.querySelector(".tpick-list");
  btn.setAttribute("aria-expanded", open); list.hidden = !open;
  if (open){ (list.querySelector('[aria-current="true"]') || list.querySelector(".tpick-opt")).focus(); }
  else if (focus) btn.focus();
}
document.addEventListener("click", e => {
  const w = document.querySelector(".tpick"); if (!w) return;
  if (e.target.closest("[data-tpick]")){ tpickOpen(w.querySelector(".tpick-list").hidden); return; }
  if (!e.target.closest(".tpick-list")) tpickOpen(false);
});
document.addEventListener("keydown", e => {
  const list = document.querySelector(".tpick-list"); if (!list || list.hidden) return;
  const opts = [...list.querySelectorAll(".tpick-opt")], i = opts.indexOf(document.activeElement);
  if (e.key === "Escape"){ e.preventDefault(); tpickOpen(false, true); }
  else if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); opts[(i + (e.key==="ArrowDown" ? 1 : -1) + opts.length) % opts.length].focus(); }
  else if (e.key === "Home" || e.key === "End"){ e.preventDefault(); opts[e.key==="Home" ? 0 : opts.length-1].focus(); }
  else if (e.key === "Tab") tpickOpen(false);

const CYL = {"dvou":2, "čtyř":4, "pěti":5, "šesti":6, "osmi":8, "dvanácti":12};

  const t = ((CAR_INFO[k]||{}).engine||{}).layout || ""; const m = t.match(/(dvou|čtyř|pěti|šesti|osmi|dvanácti)válec/); if (!m) return null;
  const n = CYL[m[1]], type = /boxer|plochý/.test(t) ? "B" : /\bV\d|vidlicový/.test(t) ? "V" : "R";
  const name = {R:"řadový", V:"vidlicový", B:"plochý (boxer)"}[type] + " " + m[1] + "válec";
  return {type, n, code: type + n, name};
}

function engineIcon(cfg){

    ["Výkon", (e.hp||c.hp) ? `${c.hpApprox?"cca ":""}${e.hp||c.hp} k` : ""], ["Točivý moment", e.nm ? fmt(e.nm)+" Nm" : "–"], ["Pohon", e.drive],
    ["Převodovka", c.gear], ["Hmotnost", c.kg ? fmt(c.kg)+" kg" : ""], ["kg/k", c.kg && c.hp ? fmt(+(c.kg/c.hp).toFixed(1)) : ""],
    ["0–100 km/h", pf.acc ? `${pf.approx?"cca ":""}${pf.acc.toLocaleString("cs",{minimumFractionDigits:1})} s` : ""], ["Max. rychlost", pf.vmax ? `${pf.approx?"cca ":""}${fmt(pf.vmax)} km/h` : ""]];
  const fam = familyOf(k), onTripV = (t,v) => (t.cars||[]).includes(v) || t.crew.some(c => c[1]===v), onTrip = t => fam.some(v => onTripV(t,v));

    </div>`;
  if (!dlg.open) dlg.showModal(); dlg.scrollTop = 0;

(() => {
  const dlg = document.getElementById("carcard");
  dlg.addEventListener("click", e => {
    const vb = e.target.closest("[data-cc-var]"); if (vb){ carCard(vb.dataset.ccVar); return; }

// Small slippy map: integer zoom levels, drag to pan, double-click / pinch / buttons to zoom.
// Addresses: a stored p.addr wins; otherwise the visitor's browser asks OpenStreetMap Nominatim once per place
// (reverse geocode, one request per second) and keeps the answer in localStorage. Google and Nominatim are blocked
// from the cloud session that edits this page, so addresses can't be baked in (Tom asked for them 2026-10-06).
const addrKey = p => `triphub.addr.${p.id}.${p.lat},${p.lon}`;
function placeAddr(p){ if (p.addr) return p.addr; try{ return localStorage.getItem(addrKey(p)) || ""; }catch(_){ return ""; } }
let addrQueue = null;
function fillPlaceAddrs(){
  if (addrQueue) return;
  const todo = PLACES.filter(p => !placeAddr(p));
  if (!todo.length) return;
  addrQueue = (async () => {
    for (const p of todo){
      try{
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=cs&lat=${p.lat}&lon=${p.lon}`);
        const a = (await r.json()).address || {};
        const street = [a.road || a.pedestrian || a.hamlet || a.suburb, a.house_number].filter(Boolean).join(" ");
        const town = a.city || a.town || a.village || a.municipality || "";
        const addr = [street, town].filter(Boolean).join(", ") + (a.country_code && a.country_code !== "cz" && a.country ? `, ${a.country}` : "");
        if (addr){
          try{ localStorage.setItem(addrKey(p), addr); }catch(_){}
          const el = document.querySelector(`[data-paddr="${p.id}"]`); if (el) el.textContent = addr;
        }
      }catch(_){}
      await new Promise(res => setTimeout(res, 1100));
    }
    addrQueue = null;
  })();
}
function initPlacesMap(){
  const el = document.getElementById("pmap"); if (!el) return;
  fillPlaceAddrs();
  const T = 256, tilesEl = el.querySelector(".pmap-tiles"), pinsEl = el.querySelector(".pmap-pins");
  const wx = (lon,z) => (lon + 180) / 360 * T * 2**z;
  const wy = (lat,z) => { const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * T * 2**z; };
  const list = shownPlaces();
  let W = el.clientWidth, H = el.clientHeight, v;
  if (pmapView) v = pmapView;
  else if (!list.length) v = {z:7, cx:wx(15.5,7), cy:wy(49.8,7)};
  else {
    const lo = Math.min(...list.map(p => p.lon)), hi = Math.max(...list.map(p => p.lon)), la = Math.min(...list.map(p => p.lat)), lb = Math.max(...list.map(p => p.lat));
    let z = 14; while (z > 3 && (wx(hi,z) - wx(lo,z) > W - 80 || wy(la,z) - wy(lb,z) > H - 120)) z--;
    v = {z, cx:(wx(lo,z) + wx(hi,z)) / 2, cy:(wy(la,z) + wy(lb,z)) / 2 - 15}; // pins stand above their point, so shift the view up a little
  }
  pmapView = v;
  const imgs = new Map();
  function draw(scale = 1, ox = 0, oy = 0){
    W = el.clientWidth; H = el.clientHeight;
    const n = 2**v.z, x0 = v.cx - W/2, y0 = v.cy - H/2, keep = new Set();
    for (let ty = Math.max(0, Math.floor(y0 / T)); ty <= Math.min(n - 1, Math.floor((y0 + H) / T)); ty++)
      for (let tx = Math.floor(x0 / T); tx <= Math.floor((x0 + W) / T); tx++){
        const key = `${v.z}/${((tx % n) + n) % n}/${ty}`, id = key + "@" + tx; keep.add(id);
        let im = imgs.get(id);
        if (!im){ im = new Image(); im.alt = ""; im.draggable = false; im.src = `https://tile.openstreetmap.org/${key}.png`; imgs.set(id, im); tilesEl.appendChild(im); }
        im.style.transform = `translate(${tx * T - x0}px,${ty * T - y0}px)`;
      }
    for (const [id, im] of imgs) if (!keep.has(id)){ im.remove(); imgs.delete(id); }
    tilesEl.style.transform = pinsEl.style.transform = scale === 1 && !ox && !oy ? "" : `translate(${ox}px,${oy}px) scale(${scale})`;
    pinsEl.innerHTML = list.map((p,i) => `<button type="button" class="ppin${placeSel===p.id?" sel":""}" data-ppin="${p.id}" style="left:${wx(p.lon,v.z) - x0}px;top:${wy(p.lat,v.z) - y0}px;--c:${placeCat_(p).c};--t:${placeCat_(p).t||"#fff"}" aria-label="${esc(p.n)}"><span><svg viewBox="0 0 24 24" aria-hidden="true">${PLACE_ICON[p.cat] || PLACE_ICON.jine}</svg></span></button>`).join("");
  }
  function zoomAt(dz, px = W/2, py = H/2){
    const z = Math.max(3, Math.min(18, v.z + dz)); if (z === v.z) return;
    const k = 2**(z - v.z); v.cx = (v.cx - W/2 + px) * k - px + W/2; v.cy = (v.cy - H/2 + py) * k - py + H/2; v.z = z; draw();
  }
  el._show = id => { const p = PLACES.find(q => q.id === id); if (!p) return; v.z = Math.max(v.z, 15); v.cx = wx(p.lon, v.z); v.cy = wy(p.lat, v.z); draw(); };
  const pts = new Map(); let start = null, moved = false;
  el.addEventListener("pointerdown", e => {
    if (e.target.closest("button,a")) return;
    el.setPointerCapture(e.pointerId); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); moved = false;
    start = {cx:v.cx, cy:v.cy, pts:new Map([...pts].map(([k,p]) => [k, {...p}]))};
  });
  el.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId) || !start) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const cur = [...pts.values()], st = [...start.pts.values()];
    if (cur.length === 1 && st.length === 1){ const dx = cur[0].x - st[0].x, dy = cur[0].y - st[0].y; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; v.cx = start.cx - dx; v.cy = start.cy - dy; draw(); }
    else if (cur.length === 2 && st.length === 2){
      const d = (a,b) => Math.hypot(a.x - b.x, a.y - b.y), r = el.getBoundingClientRect();
      const s = d(cur[0],cur[1]) / d(st[0],st[1]), mx = (st[0].x + st[1].x) / 2 - r.left, my = (st[0].y + st[1].y) / 2 - r.top;
      start.scale = s; start.mx = mx; start.my = my; moved = true;
      draw(s, mx - mx * s, my - my * s);
    }
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (start && start.scale){ const dz = Math.round(Math.log2(start.scale)); draw(); if (dz) zoomAt(dz, start.mx, start.my); }
    start = pts.size ? {cx:v.cx, cy:v.cy, pts:new Map([...pts].map(([k,p]) => [k, {...p}]))} : null;
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  // No wheel zoom (Tom 2026-10-05): scrolling the page over the map must not zoom it; use +/−, double-click or pinch.
  el.addEventListener("dblclick", e => { if (e.target.closest("button,a")) return; const r = el.getBoundingClientRect(); zoomAt(1, e.clientX - r.left, e.clientY - r.top); });
  el.addEventListener("click", e => {
    const z = e.target.closest("[data-pzoom]"); if (z){ zoomAt(+z.dataset.pzoom); return; }
    const pin = e.target.closest("[data-ppin]"); if (!pin || moved) return;
    placeSel = pin.dataset.ppin; draw();
    document.querySelectorAll(".place").forEach(c => c.classList.toggle("sel", c.id === "place-" + placeSel));
    const card = document.getElementById("place-" + placeSel); if (card) card.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  });
  if (el._ro) el._ro.disconnect(); el._ro = new ResizeObserver(() => draw()); el._ro.observe(el);
  draw();
}

const SECTIONS = {next:viewNext, past:viewPast, members:() => viewMembers("people"), cars:() => viewMembers("cars"), places:viewPlaces};
// Tom 2026-10-06: the hero photo runs up behind the top menu; --top-h is the header's height.
function heroUnderTop(){
  const v = document.getElementById("view"), f = v.firstElementChild, on = !!(f && f.matches(".hero.has-img"));
  document.body.classList.toggle("over-hero", on);
  document.documentElement.style.setProperty("--top-h", document.querySelector(".top").offsetHeight + "px");
  topState();
}
addEventListener("resize", () => { if (document.body.classList.contains("over-hero")) heroUnderTop(); else topState(); });
// Menu turns solid once the hero photo has scrolled out from under it.
function topState(){
  const b = document.body, top = document.querySelector(".top"), h = top.offsetHeight, f = document.getElementById("view").firstElementChild;
  b.classList.toggle("scrolled", scrollY > 4);
  b.classList.toggle("top-solid", !b.classList.contains("over-hero") || !f || f.getBoundingClientRect().bottom < h + 1);
}
addEventListener("scroll", topState, {passive:true});
function render(){
  document.querySelectorAll(".sections > .sec").forEach(b => b.setAttribute("aria-selected", b.dataset.sec===sec));
  document.getElementById("view").innerHTML = SECTIONS[sec]();
  initZoomMaps(); initPlacesMap(); heroUnderTop();
  const want = "#" + stateHash();
  if (location.hash !== want) try{ history[firstRender ? "replaceState" : "pushState"](null,"",want); }catch(_){}
  firstRender = false;
}
let firstRender = true;
const stateHash = () => sec === "past" && pastId ? `past/${pastId}/${pastTab}` : sec === "next" && nextId && curNext() !== upcomingTrips()[0] ? `next/${nextId}` : sec;
function applyHash(){
  const [s, id, tab] = (location.hash||"").slice(1).split("/");
  if (!SECTIONS[s]) return false;
  sec = s;
  if (s === "next") nextId = id && TRIPS.some(t => t.id===id && t.status==="next") ? id : "";
  if (s === "past" && id && TRIPS.some(t => t.id===id && t.status==="done")){ pastId = id; pastTab = fixTab(trip(id), tab); }
  return true;
}
window.addEventListener("popstate", () => { if (applyHash()) render(); });
function go(s){ sec = s; render(); }

document.querySelector("[data-home]").addEventListener("click", e => {
  e.preventDefault();
  pastId = (TRIPS.find(t => t.status==="done")||{}).id; pastTab = "home";
  go(TRIPS.some(t => t.status==="next") ? "next" : "past"); window.scrollTo(0,0);
});
document.querySelector(".sections").addEventListener("click", e => {
  const b = e.target.closest("[data-sec]"); if (b) go(b.dataset.sec);
});
const view = document.getElementById("view");
view.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.delStory){ deleteStory(+b.dataset.delStory, b); return; }
  if (b.dataset.editStory){ editStory(+b.dataset.editStory); return; }
  if (b.hasAttribute("data-cancel-edit")){ stopEditing(); return; }
  if (b.dataset.unpick){ const [p] = pickedPhotos.splice(+b.dataset.unpick, 1); if (p.file) URL.revokeObjectURL(p.url); refreshPicks(); return; }
  if (b.dataset.sphoto){ const [id,i] = b.dataset.sphoto.split(":"), st = Object.values(sharedStories).flat().find(x => x.id === +id); if (st){ lbList = st.photos.map(src => ({src, cap:st.t})); lbShow(+i); } return; }
  if (b.dataset.nextTrip){ nextId = b.dataset.nextTrip; render(); const nb = document.querySelector(".tpick-btn"); if (nb) nb.focus({preventScroll:true}); return; }
  if (b.dataset.trip){ const fromPick = b.classList.contains("tpick-opt"); pastId = b.dataset.trip; pastTab = defTab(trip(pastId)); render(); if (fromPick){ const nb = document.querySelector(".tpick-btn"); if (nb) nb.focus({preventScroll:true}); } }
  else if (b.dataset.tab){ pastTab = b.dataset.tab; render(); if (b.classList.contains("home-day")){ const n = document.querySelector(".tabs"); if (n) n.scrollIntoView({block:"start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); } }
  else if (b.dataset.goto){ pastId = b.dataset.goto; pastTab = defTab(trip(pastId)); go("past"); window.scrollTo(0,0); }
  else if (b.dataset.photo){ lbShow(+b.dataset.photo); }
  else if (b.dataset.dphoto){ const [tid,dd,i] = b.dataset.dphoto.split(":"), t = trip(tid); lbList = t.photos.filter(p => p.day === +dd); lbShow(+i); }
  else if (b.dataset.daymap){ lbList = [{src:b.dataset.daymap, cap:"Mapa trasy"}]; lbShow(0); }
  else if (b.dataset.car){ carCard(b.dataset.car); }
  else if (b.dataset.row){
    if (!document.getElementById("row-" + b.dataset.row)) go("cars"); // garage links on Lidé jump to the Auta section
    const tr = document.getElementById("row-" + b.dataset.row); if (!tr) return;
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    tr.scrollIntoView({block:"center", behavior: calm ? "auto" : "smooth"});
    tr.classList.remove("flash"); void tr.offsetWidth; tr.classList.add("flash");
    tr.querySelector(".car-cell").focus({preventScroll:true});
  }
  else if (b.dataset.pcat){ placeCat = b.dataset.pcat; pmapView = null; render(); }
  else if (b.dataset.pshow){
    const m = document.getElementById("pmap"); placeSel = b.dataset.pshow;
    document.querySelectorAll(".place").forEach(c => c.classList.toggle("sel", c.id === "place-" + placeSel));
    if (m && m._show){ m._show(placeSel); m.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
  }
  else if (b.dataset.sort){ const k = b.dataset.sort; fleetDir = k===fleetSort ? -fleetDir : FLEET_SORTS.find(x=>x[0]===k)[2]; fleetSort = k; render(); }
  else if (b.dataset.editRoute){ const f = view.querySelector(`[data-route-form="${b.dataset.editRoute}"]`); f.hidden = !f.hidden; if (!f.hidden) f.querySelector("input").focus(); }
  else if (b.dataset.resetRoute){ const t = curNext(); const k = b.dataset.resetRoute; store.set(routeKey(t, k==="trip"?null:+k), ""); render(); }
});
(() => {

view.addEventListener("change", e => {
  if (e.target.id !== "photo-input") return;

view.addEventListener("submit", e => {
  if (e.target.dataset.routeForm){
    e.preventDefault();
    const v = e.target.querySelector("input").value.trim();
    if (!isMapy(v)){ e.target.querySelector(".route-err").textContent = "Vlož odkaz, který začíná https://mapy.com nebo https://mapy.cz (v Mapy.cz použij Sdílet → Kopírovat odkaz)."; return; }
    const t = curNext(); const k = e.target.dataset.routeForm;
    store.set(routeKey(t, k==="trip"?null:+k), v); render(); return;
  }
  if (e.target.id !== "compose") return;
  e.preventDefault();
  const f = e.target, val = id => document.getElementById(id).value.trim(), msg = document.getElementById("s-msg"), btn = f.querySelector('button[type="submit"]');
  if (!STORY_DB.url) return;
  const pass = document.getElementById("s-pass").value, tripId = pastId, story = {trip: tripId, by_name: val("s-by"), story_title: val("s-title"), story_body: val("s-body")};
  const rpc = (fn, body) => fetch(`${STORY_DB.url}/rest/v1/rpc/${fn}`, {method:"POST", headers: dbHeaders(), body: JSON.stringify(body)})
    .then(r => r.json().catch(() => ({})).then(j => { if (!r.ok) throw new Error(/password/.test(j.message||"") ? "pass" : "fail"); return j; }));
  btn.disabled = true; msg.textContent = "Ukládám…";
  const picks = pickedPhotos.slice(), files = picks.filter(p => p.file).map(p => p.file), ed = editing && editing.trip === tripId ? editing : null;
  // Check the password before uploading, so a typo doesn't leave stray photos behind.
  (files.length ? rpc("check_story_pass", {pass}).then(ok => { if (!ok) throw new Error("pass"); }) : Promise.resolve())
    .then(() => files.reduce((chain, file, i) => chain.then(paths => {
      msg.textContent = `Nahrávám fotky ${i+1}/${files.length}…`;
      return shrinkPhoto(file).then(b => uploadPhoto(b, tripId, i)).then(p => [...paths, p]);
    }), Promise.resolve([])))
    .then(uploaded => {
      msg.textContent = "Ukládám…";

      if (ed) return rpc("update_story", {pass, story_id: ed.id, by_name: story.by_name, story_title: story.story_title, story_body: story.story_body, photos});
      return rpc("add_story", photos.length ? {pass, ...story, photos} : {pass, ...story});
    })

      store.set("story-pass", pass);
      pickedPhotos.forEach(p => p.file && URL.revokeObjectURL(p.url)); pickedPhotos = [];
      const list = sharedStories[tripId] ||= [];
      if (ed){ const i = list.findIndex(x => x.id === ed.id); if (i >= 0) list[i] = toStory(j); else list.unshift(toStory(j)); editing = null; }

const GUEST_HASH = "9aea975aa81c0e9f85e86ed9eff9b64186302176f9c4ff8f867597b79bff30b5";
// Site password gate (Tom 2026-10-06): the group password is checked by Supabase (rpc check_story_pass), so it isn't in the page.
// It only hides the site from casual visitors; the repo and its files stay public on GitHub.
const sha256 = async t => crypto.subtle ? [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map(x => x.toString(16).padStart(2,"0")).join("") : "";
document.getElementById("logout").addEventListener("click", () => {
  store.set("site-auth", ""); store.set("story-pass", "");
  const html = document.documentElement, f = document.getElementById("gate-form");
  html.classList.remove("guest"); html.classList.add("locked");
  f.reset(); f.querySelector("button").disabled = false; document.getElementById("gate-msg").textContent = "";
  scrollTo(0, 0); document.getElementById("gate-pass").focus();
});
document.getElementById("gate-form").addEventListener("submit", async e => {
  e.preventDefault();
  const pass = document.getElementById("gate-pass").value, msg = document.getElementById("gate-msg"), btn = e.target.querySelector("button"), html = document.documentElement;
  const enter = mode => { store.set("site-auth", mode); html.classList.toggle("guest", mode === "guest"); html.classList.remove("locked"); render(); };
  // Guest password (Tom 2026-10-06): view only, no stories or photos. Only its SHA-256 is in the page.
  if (await sha256(pass) === GUEST_HASH) return enter("guest");
  btn.disabled = true; msg.textContent = "Ověřuji…";
  fetch(`${STORY_DB.url}/rest/v1/rpc/check_story_pass`, {method:"POST", headers: dbHeaders(), body: JSON.stringify({pass})})
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(ok => {
      if (ok !== true){ msg.textContent = "Špatné heslo."; btn.disabled = false; return; }
      store.set("story-pass", pass); enter("1");
    })
    .catch(() => { msg.textContent = "Heslo se teď nepodařilo ověřit. Zkus to znovu."; btn.disabled = false; });
});
